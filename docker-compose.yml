# PostgreSQL 16 + pgvector for the k8s-rag-rls project.
# Values come from .env in this folder (Docker Compose reads it automatically).
#
#   docker compose up -d          # start
#   docker compose ps             # status (should show "healthy")
#   docker compose down           # stop (data kept in volume)
#   docker compose down -v        # stop AND delete all data
#
# Use scripts\db_docker.ps1 instead of calling these directly: it also creates/verifies
# the database, roles, tables and RLS.

name: k8s-rag-rls

services:
  postgres:
    image: ${PG_IMAGE:-pgvector/pgvector:pg16}
    container_name: ${PG_CONTAINER:-k8s-rag-pg}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${PG_SUPERUSER_PASSWORD:?Set PG_SUPERUSER_PASSWORD in .env}
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --encoding=UTF8"
      TZ: Asia/Kolkata
    ports:
      # bind to localhost only - not exposed to the network
      - "127.0.0.1:${PG_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/sql:ro            # project SQL scripts, run by db_docker.ps1
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  pgdata:
    name: k8s-rag-pgdata
